# Environment for running Drupal's PHPUnit and WebDriver tests against the
# selenium `chrome` service (docker-compose.selenium.yaml).
web_environment:
  - SIMPLETEST_DB=mysql://db:db@db/db
  - SIMPLETEST_BASE_URL=${DDEV_PRIMARY_URL}
  - BROWSERTEST_OUTPUT_DIRECTORY=/var/www/html/web/sites/simpletest/browser_output
  - BROWSERTEST_OUTPUT_BASE_URL=${DDEV_PRIMARY_URL}
  - DRUPAL_TEST_WEBDRIVER_HOSTNAME=chrome
  - DRUPAL_TEST_WEBDRIVER_PORT=4444
  - DRUPAL_TEST_CHROMEDRIVER_AUTOSTART=false
  - DRUPAL_TEST_WEBDRIVER_W3C=true
  - MINK_DRIVER_ARGS_WEBDRIVER=[\"chrome\", {\"browserName\":\"chrome\", \"goog:chromeOptions\":{\"w3c\":true, \"args\":[\"--no-sandbox\",\"--ignore-certificate-errors\",\"--allow-insecure-localhost\",\"--disable-features=HttpsUpgrades\"]}}, \"http://chrome:4444\"]
